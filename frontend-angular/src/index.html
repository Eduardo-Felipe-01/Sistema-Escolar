<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Educa+ - Sistema Integrado de Gestão Escolar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema Escolar Inteligente para Professores, Alunos e Coordenadores com Lançamento de Notas, Frequência e Acessibilidade">
  <link rel="icon" type="image/png" href="assets/logo-educa-mais.png">
  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <!-- SVG Filters para Daltonismo (Protanopia, Deuteranopia, Tritanopia, Acromatopsia) -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <!-- Protanopia (dificuldade vermelho) -->
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0  0.558, 0.442, 0, 0, 0  0, 0.242, 0.758, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
      <!-- Deuteranopia (dificuldade verde) -->
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0  0.7, 0.3, 0, 0, 0  0, 0.3, 0.7, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
      <!-- Tritanopia (dificuldade azul) -->
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0  0, 0.433, 0.567, 0, 0  0, 0.475, 0.525, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
      <!-- Acromatopsia (monocromático) -->
      <filter id="achromatopsia-filter">
        <feColorMatrix type="matrix" values="0.299, 0.587, 0.114, 0, 0  0.299, 0.587, 0.114, 0, 0  0.299, 0.587, 0.114, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
    </defs>
  </svg>

  <app-root></app-root>

  <!-- Widget VLibras oficial para Acessibilidade em Língua Brasileira de Sinais -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      if (window.VLibras) {
        new window.VLibras.Widget('https://vlibras.gov.br/app');
      }
    });

    (function() {
      var hiddenElements = [];
      var vlibrasHidden = false;

      var vlibrasSelectors = [
        '#vlibras-access-wrapper',
        '#vlibras-access',
        '#vlibras-button',
        '#vlibras-popup',
        '[id^="vlibras"]',
        '[vw]',
        '[vp]',
        '[vw-access-button]',
        '[vw-plugin-wrapper]',
        '.vw-access-button',
        '.vw-plugin-wrapper',
        '.vpw-box',
        'iframe[src*="vlibras"]'
      ].join(', ');

      function hideVLibrasForPrint() {
        document.body.classList.add('is-printing-pdf');
        if (vlibrasHidden) return;
        vlibrasHidden = true;

        var nodes = document.querySelectorAll(vlibrasSelectors);
        nodes.forEach(function(el) {
          if (!el) return;
          hiddenElements.push({
            el: el,
            prevDisplay: el.style.getPropertyValue('display'),
            prevDisplayPriority: el.style.getPropertyPriority('display'),
            prevVisibility: el.style.getPropertyValue('visibility'),
            prevVisibilityPriority: el.style.getPropertyPriority('visibility'),
            prevOpacity: el.style.getPropertyValue('opacity'),
            prevOpacityPriority: el.style.getPropertyPriority('opacity')
          });
          el.style.setProperty('display', 'none', 'important');
          el.style.setProperty('visibility', 'hidden', 'important');
          el.style.setProperty('opacity', '0', 'important');
        });
      }

      function restoreVLibrasAfterPrint() {
        document.body.classList.remove('is-printing-pdf');
        while (hiddenElements.length > 0) {
          var item = hiddenElements.pop();
          var el = item.el;
          if (!el) continue;
          if (item.prevDisplay) {
            el.style.setProperty('display', item.prevDisplay, item.prevDisplayPriority);
          } else {
            el.style.removeProperty('display');
          }
          if (item.prevVisibility) {
            el.style.setProperty('visibility', item.prevVisibility, item.prevVisibilityPriority);
          } else {
            el.style.removeProperty('visibility');
          }
          if (item.prevOpacity) {
            el.style.setProperty('opacity', item.prevOpacity, item.prevOpacityPriority);
          } else {
            el.style.removeProperty('opacity');
          }
        }
        vlibrasHidden = false;
      }

      window.__educaHideVLibras = hideVLibrasForPrint;
      window.__educaRestoreVLibras = restoreVLibrasAfterPrint;

      window.addEventListener('beforeprint', hideVLibrasForPrint);
      window.addEventListener('afterprint', restoreVLibrasAfterPrint);

      var originalPrint = window.print.bind(window);
      window.__educaRawPrint = originalPrint;
      window.print = function() {
        hideVLibrasForPrint();
        requestAnimationFrame(function() {
          setTimeout(function() {
            originalPrint();
          }, 60);
        });
      };
    })();
  </script>
</body>
</html>
