<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EducaGestão - Sistema Integrado de Gestão Escolar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema Escolar Inteligente para Professores, Alunos e Coordenadores com Lançamento de Notas, Frequência e Acessibilidade">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- SVG Filters para Daltonismo (Protanopia, Deuteranopia, Tritanopia, Acromatopsia) -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <!-- Protanopia (dificuldade vermelho) -->
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0  0.558, 0.442, 0, 0, 0  0, 0.242, 0.758, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
      <!-- Deuteranopia (dificuldade verde) -->
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0  0.7, 0.3, 0, 0, 0  0, 0.3, 0.7, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
      <!-- Tritanopia (dificuldade azul) -->
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0  0, 0.433, 0.567, 0, 0  0, 0.475, 0.525, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
      <!-- Acromatopsia (monocromático) -->
      <filter id="achromatopsia-filter">
        <feColorMatrix type="matrix" values="0.299, 0.587, 0.114, 0, 0  0.299, 0.587, 0.114, 0, 0  0.299, 0.587, 0.114, 0, 0  0, 0, 0, 1, 0"/>
      </filter>
    </defs>
  </svg>

  <app-root></app-root>

  <!-- Widget VLibras oficial para Acessibilidade em Língua Brasileira de Sinais -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      if (window.VLibras) {
        new window.VLibras.Widget('https://vlibras.gov.br/app');
      }
    });
  </script>
</body>
</html>
