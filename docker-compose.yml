version: '3.8'

services:
  # 1. Banco de Dados Principal: PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: escola-postgres
    restart: always
    environment:
      POSTGRES_DB: escola_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escola_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Banco de Dados Secundário: MongoDB (Auditoria e Logs)
  mongo-db:
    image: mongo:7.0
    container_name: escola-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: escola_secundaria
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 15s

  # 3. Microserviço Python de Processamento e Análise Estatística
  python-analytics:
    build:
      context: ./python-analytics
      dockerfile: Dockerfile
    container_name: escola-python-analytics
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # 4. Backend Central: Java + Spring Boot
  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: escola-backend-spring
    restart: always
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-db:5432/escola_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      MONGODB_URI: mongodb://mongo-db:27017/escola_secundaria
      ANALYTICS_URL: http://python-analytics:8000
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      python-analytics:
        condition: service_started

  # 5. Frontend Web: Angular + TypeScript
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: escola-frontend-angular
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - backend-spring
      - python-analytics

volumes:
  postgres_data:
  mongo_data:
